name: Gerar e publicar Monitor do PPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  processar:
    name: Validar dados e preparar painel
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar ferramentas
        run: pip install -r requirements.txt

      - name: Ler planilha, validar e gerar JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: python scripts/processar_dados.py

      - name: Conferir estrutura do JSON
        run: python -m json.tool data/iniciativas.json > /dev/null

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar pacote do painel
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    name: Publicar painel
    needs: processar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
